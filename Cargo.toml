[workspace]
resolver = "2"
members = ["crates/xtop-core", "crates/xtop-tui", "crates/xtop-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.39"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
